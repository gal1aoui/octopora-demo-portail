<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maquette : Aperçu d'un document</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/maquettes/apercu-document.css">
</head>
<body>
  <header class="app-header">
    <strong>Mon espace assuré</strong>
    <nav>
      <a href="../index.html">Mes contrats</a>
      <a href="../sinistre.html">Déclarer un sinistre</a>
    </nav>
  </header>
  <main>

    <h1>constat-amiable.pdf</h1>
    <p class="muted">Contrat AUTO-2024-0187, déposé le 12/03/2025, 1,5 Mo.</p>
    <div class="viewer card">
      <div class="toolbar" role="toolbar" aria-label="Actions sur le document">
        <button type="button" class="button secondary">Zoom -</button>
        <button type="button" class="button secondary">Zoom +</button>
        <button type="button" class="button secondary">Pivoter</button>
        <a class="button" href="#">Télécharger</a>
      </div>
      <div class="page" role="img" aria-label="Aperçu de la page 1 sur 2">
        <p>Constat amiable d'accident automobile</p>
        <span class="muted">Page 1 sur 2</span>
      </div>
      <div class="pager">
        <button type="button" class="button secondary" disabled>Page précédente</button>
        <button type="button" class="button secondary">Page suivante</button>
      </div>
    </div>
  </main>
</body>
</html>
