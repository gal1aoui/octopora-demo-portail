<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maquette : page de connexion</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/maquettes/connexion-responsive.css">
</head>
<body>
  <header class="app-header">
    <strong>Mon espace assuré</strong>
    <nav>
      <a href="../index.html">Mes contrats</a>
      <a href="../sinistre.html">Déclarer un sinistre</a>
    </nav>
  </header>
  <main>
    <section class="login card">
      <h1>Connexion</h1>
      <p class="muted">Accédez à vos contrats et à vos sinistres.</p>
      <form>
        <label>Adresse e-mail <input type="email" name="email" autocomplete="username" required></label>
        <label>Mot de passe <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit" class="button">Se connecter</button>
        <a class="muted" href="#">Mot de passe oublié ?</a>
      </form>
      <p class="muted">Pas encore de compte ? <a href="#">Créer mon espace</a></p>
    </section>
  </main>
</body>
</html>
