<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon espace assuré</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <header class="app-header">
    <strong>Mon espace assuré</strong>
    <nav>
      <a href="index.html" aria-current="page">Mes contrats</a>
      <a href="sinistre.html">Déclarer un sinistre</a>
    </nav>
  </header>
  <main id="contenu" tabindex="-1">
    <h1>Mes contrats</h1>
    <p class="muted">Retrouvez vos contrats, vos garanties et vos attestations.</p>
    <form class="filters" id="filtres">
      <label>Type
        <select name="type" aria-controls="contrats">
          <option value="">Tous</option>
          <option value="auto">Auto</option>
          <option value="habitation">Habitation</option>
          <option value="sante">Santé</option>
        </select>
      </label>
      <label>Statut
        <select name="statut" aria-controls="contrats">
          <option value="">Tous</option>
          <option value="actif">Actif</option>
          <option value="resilie">Résilié</option>
        </select>
      </label>
    </form>
    <ul class="contract-list" id="contrats" aria-live="polite"></ul>
  </main>
  <script type="module" src="js/contracts.js"></script>
</body>
</html>
